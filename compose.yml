services:
  db_anomaly_detection:
    build:
      context: ./db/anomaly_detection
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: anomaly_detection
      MYSQL_USER: app
      MYSQL_PASSWORD: ppa
    ports:
      - "3308:3306"
    volumes:
      - anomaly_detection_db_data:/var/lib/mysql
    networks: [app_net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: [app_net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cassandra_master:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: mallog-cassandra
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
    ports:
      - "9042:9042"
    volumes:
      - cassandra_master_data:/var/lib/cassandra
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e \"DESCRIBE KEYSPACES\" >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  cassandra_datanode_1:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: mallog-cassandra
      CASSANDRA_SEEDS: cassandra_master
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack2
    depends_on:
      cassandra_master:
        condition: service_healthy
    volumes:
      - cassandra_datanode_1_data:/var/lib/cassandra
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e \"DESCRIBE KEYSPACES\" >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  cassandra_datanode_2:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: mallog-cassandra
      CASSANDRA_SEEDS: cassandra_master
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack3
    depends_on:
      cassandra_master:
        condition: service_healthy
    volumes:
      - cassandra_datanode_2_data:/var/lib/cassandra
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e \"DESCRIBE KEYSPACES\" >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  log_ingestion_service:
    build:
      context: ./log_ingestion_service
      dockerfile: Dockerfile
    environment:
      LOG_INGESTION_HTTP_HOST: 0.0.0.0
      LOG_INGESTION_HTTP_PORT: 8001
      LOG_INGESTION_GRPC_HOST: 0.0.0.0
      LOG_INGESTION_GRPC_PORT: 50051
      LOG_INGESTION_MAX_UPLOAD_BYTES: 10485760
    ports:
      - "8001:8001"
      - "50051:50051"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=2).getcode()==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]
    restart: unless-stopped

  anomaly_detection_service:
    build:
      context: ./anomaly_detection_service
      dockerfile: Dockerfile
    environment:
      ANOMALY_HTTP_HOST: 0.0.0.0
      ANOMALY_HTTP_PORT: 5002
      ANOMALY_MYSQL_HOST: db_anomaly_detection
      ANOMALY_MYSQL_PORT: 3306
      ANOMALY_MYSQL_USER: app
      ANOMALY_MYSQL_PASSWORD: ppa
      ANOMALY_MYSQL_DATABASE: anomaly_detection
      ANOMALY_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ANOMALY_REQUEST_QUEUE: anomaly.requests
      ANOMALY_RESULT_QUEUE: anomaly.results
    ports:
      - "5002:5002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      db_anomaly_detection:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5002/health',timeout=2).getcode()==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]
    restart: unless-stopped

  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    environment:
      API_GATEWAY_HTTP_HOST: 0.0.0.0
      API_GATEWAY_HTTP_PORT: 8080
      API_GATEWAY_TEST_LOG_PATH: /app/system_test
      LOG_INGESTION_GRPC_TARGET: log_ingestion_service:50051
      API_GATEWAY_GRPC_CHUNK_SIZE: 4096
      API_GATEWAY_GRPC_TIMEOUT_SECONDS: 20
      API_GATEWAY_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      API_GATEWAY_ANOMALY_REQUEST_QUEUE: anomaly.requests
      API_GATEWAY_RABBITMQ_TIMEOUT_SECONDS: 30
      API_GATEWAY_RABBITMQ_POLL_INTERVAL_SECONDS: 0.25
      API_GATEWAY_CASSANDRA_CONTACT_POINTS: cassandra_master,cassandra_datanode_1,cassandra_datanode_2
      API_GATEWAY_CASSANDRA_PORT: 9042
      API_GATEWAY_CASSANDRA_KEYSPACE: gateway_logs
      API_GATEWAY_CASSANDRA_TABLE: call_logs
    volumes:
      - ./system_test:/app/system_test:ro
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      log_ingestion_service:
        condition: service_healthy
      anomaly_detection_service:
        condition: service_healthy
      cassandra_master:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).getcode()==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]
    restart: unless-stopped

volumes:
  anomaly_detection_db_data:
  cassandra_master_data:
  cassandra_datanode_1_data:
  cassandra_datanode_2_data:

networks:
  app_net: {}

