name: CI

on:
  push:
  pull_request:

jobs:
  test-express-ts-auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: auth_service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  test-python-services-and-gateway:
    name: Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - log_ingestion_service
          - anomaly_detection_service
          - api_gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: python -m unittest discover -s tests -p "test_*.py"
